# Notebook drift detector workflow. Two job tiers:
#
#   1. notebook-lint (HARD GATE, every PR, ~2-3 min, no torch installed)
#      tests/test_notebook_json_validity.py
#      tests/test_notebook_pin_consistency.py
#      tests/test_nemo_gym_uv_interpreter.py
#      tests/test_notebook_amd_install_parity.py
#      tests/test_upgrade_installs_pin_pillow.py
#      tests/test_notebook_vllm_pin.py
#      tests/test_python_scripts_regen_parity.py  (live nbconvert)
#
#   2. api-drift (HARD GATE on cell 1, informational on cell 3, ~3-5min)
#      tests/test_notebook_api_drift.py against three (transformers, trl)
#      combos: HF=4.57.6 + TRL<1, HF=default + TRL=default, HF=latest +
#      TRL=latest.
#
# Mirrors the policy on unslothai/unsloth-zoo PR #637 and
# unslothai/unsloth PR #5414: drift detector failures fire pytest.fail
# with "DRIFT DETECTED: ..." -- never pytest.skip -- so a real upstream
# regression goes red BEFORE a notebook user on Colab hits the crash.

name: Notebooks Tests

on:
  pull_request:
    paths:
      - 'original_template/**'
      - 'nb/**'
      - 'kaggle/**'
      - 'python_scripts/**'
      - 'molab/**'
      - 'update_all_notebooks.py'
      - 'replace_text.py'
      - 'update_max_seq_length.py'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'README.md'
      - '.github/workflows/notebooks-tests-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notebook-lint:
    name: notebook static checks (HARD GATE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pytest + generator deps (no torch / no model)
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          # nbformat + nbconvert + pyspellchecker + tqdm + huggingface_hub
          # are what update_all_notebooks.py imports at module top; the
          # AMD parity + regen-parity tests need the module to load.
          # ipython is required by nbconvert's PythonExporter to
          # translate cell magics (%%bash, %%capture) into
          # ``get_ipython().run_cell_magic(...)`` calls. Without it
          # nbconvert silently falls back to commenting out the raw
          # magic syntax and the regen-parity diff fires false-positive
          # on every notebook that uses a cell magic.
          pip install pytest pyyaml nbformat nbconvert ipython \
            pyspellchecker tqdm huggingface_hub

      - name: Install marimo + ruff (molab generator + format pass)
        # Generator deps. Kept as a separate step so they are easy to spot
        # and to pin/skip independently if either is yanked upstream.
        #   marimo  — scripts/molab_generate.py (marimo.App / @app.cell
        #             emission) + test_molab_marimo_validity.py (marimo
        #             check) + test_molab_generation_parity.py
        #   ruff    — scripts/molab_generate.py runs `ruff format` over
        #             every generated notebook to re-wrap the lines that
        #             marimo's IR conversion ast-unparses (rename pass).
        #             Pinned so regeneration is byte-stable across CI runs.
        # Exact pins: marimo stamps its version into __generated_with, so
        # any release drifts parity. Bump pins together with a regen commit.
        run: pip install 'marimo==0.23.8' 'ruff==0.15.16'

      - name: tests/test_notebook_json_validity.py
        run: |
          python -m pytest tests/test_notebook_json_validity.py -q --tb=short

      - name: tests/test_notebook_pin_consistency.py
        run: |
          python -m pytest tests/test_notebook_pin_consistency.py -q --tb=short

      - name: tests/test_notebook_amd_install_parity.py
        run: |
          python -m pytest tests/test_notebook_amd_install_parity.py -q --tb=short

      - name: tests/test_nemo_gym_uv_interpreter.py
        # The NeMo Gym setup cell must let uv fetch the interpreter
        # Gym/.python-version pins instead of naming one itself. Colab's
        # preinstalled uv cannot reach that release without an upgrade
        # first, and satisfying only the floor lands on a 3.14 that
        # cannot build yappi.
        run: |
          python -m pytest tests/test_nemo_gym_uv_interpreter.py -q --tb=short

      - name: tests/test_synthetic_data_hackathon_generation.py
        # The in-notebook generator skips itself once data/final/ holds a
        # *.json, so a run that dies mid-publish must leave nothing behind
        # that a later run would accept and train on.
        run: |
          python -m pytest tests/test_synthetic_data_hackathon_generation.py -q --tb=short

      - name: tests/test_amd_install_heading_adjacency.py
        # The parity test above reads the COMMITTED nb/AMD-*.ipynb, which stay
        # valid while stale. This one drives the collector directly, so it sees
        # what a regeneration would produce.
        run: |
          python -m pytest tests/test_amd_install_heading_adjacency.py -q --tb=short

      - name: tests/test_amd_source_is_nb_for_hand_maintained.py
        run: |
          python -m pytest tests/test_amd_source_is_nb_for_hand_maintained.py -q --tb=short

      - name: tests/test_amd_news_section.py
        # News lives only in original_template/, so an AMD variant minted from a
        # hand-maintained nb/ source has to be handed it back.
        run: |
          python -m pytest tests/test_amd_news_section.py -q --tb=short

      - name: tests/test_amd_moe_autotune_guard.py
        run: |
          python -m pytest tests/test_amd_moe_autotune_guard.py -q --tb=short

      - name: tests/test_saving_cell_names_a_bound_object.py
        run: |
          python -m pytest tests/test_saving_cell_names_a_bound_object.py -q --tb=short

      - name: tests/test_pinned_vllm_can_import_pinned_transformers.py
        # Two ways a vLLM pin can be wrong that only show up on hardware. A
        # vLLM below 0.10.0 cannot import beside transformers 4.54+, and a
        # vLLM inside unsloth_zoo's standby windows raises RuntimeError on the
        # install cell. Both are checked against bounds rather than assumed.
        run: |
          python -m pytest tests/test_pinned_vllm_can_import_pinned_transformers.py -q --tb=short

      - name: tests/test_every_notebook_installs_its_stack.py
        # Colab and Kaggle ship neither unsloth nor trl, so a notebook that
        # imports them without an install cell cannot run at all.
        run: |
          python -m pytest tests/test_every_notebook_installs_its_stack.py -q --tb=short

      - name: tests/test_generate_takes_transformers_kwargs.py
        # `.generate()` is transformers, so a vLLM sampling name in it is a
        # ValueError the moment the cell runs.
        run: |
          python -m pytest tests/test_generate_takes_transformers_kwargs.py -q --tb=short

      - name: tests/test_vllm_cells_resolve_torchao_against_torch.py
        # A pinned vLLM takes torch backwards, so torchao has to be chosen
        # against the torch that ends up installed, not against latest.
        run: |
          python -m pytest tests/test_vllm_cells_resolve_torchao_against_torch.py -q --tb=short

      - name: tests/test_amd_git_main_unsloth_install.py
        # An AMD variant must keep the git-main unsloth upgrade its CUDA source
        # uses; the ignore list hid the drop from the parity validator.
        run: |
          python -m pytest tests/test_amd_git_main_unsloth_install.py -q --tb=short

      - name: tests/test_transformers5_hub_floor.py
        run: |
          python -m pytest tests/test_transformers5_hub_floor.py -q --tb=short

      - name: tests/test_live_names_bound_only_in_dead_code.py
        run: |
          python -m pytest tests/test_live_names_bound_only_in_dead_code.py -q --tb=short

      - name: tests/test_transformers_main_no_deps_floors.py
        # A --no-deps install of transformers main has to pin every floor the
        # base images fall short of, not only the one that broke last.
        run: |
          python -m pytest tests/test_transformers_main_no_deps_floors.py -q --tb=short

      - name: tests/test_trackio_args_match_pinned_transformers.py
        # A trackio TrainingArguments field is only a keyword on the
        # transformers that declares it. Passing one under an older exact pin
        # is a TypeError from the config, ten cells past the install cell.
        run: |
          python -m pytest tests/test_trackio_args_match_pinned_transformers.py -q --tb=short

      - name: tests/test_every_test_runs_in_ci.py
        run: |
          python -m pytest tests/test_every_test_runs_in_ci.py -q --tb=short

      - name: tests/test_qat_numpy_pin.py
        run: |
          python -m pytest tests/test_qat_numpy_pin.py -q --tb=short

      - name: tests/test_force_reinstall_does_not_replace_numpy.py
        # Same "numpy was upgraded mid-session" error as the QAT pin above,
        # reached through a different install line. It is also the other half
        # of the transformers-main floors gate, which matches on --no-deps and
        # so cannot see a cell that never passed the flag.
        run: |
          python -m pytest tests/test_force_reinstall_does_not_replace_numpy.py -q --tb=short

      - name: tests/test_no_backgrounded_shell_launch.py
        # nbclient + ipykernel so the live-kernel case actually runs. Without
        # them it importorskips, and the point of that case is to measure
        # `system_piped` on the runner rather than read it off the source.
        run: |
          pip install nbclient ipykernel
          python -m pytest tests/test_no_backgrounded_shell_launch.py -q --tb=short

      - name: tests/test_no_amd_variant_without_sglang.py
        run: |
          python -m pytest tests/test_no_amd_variant_without_sglang.py -q --tb=short

      - name: tests/test_sglang_torchvision_rebuild.py
        run: |
          python -m pytest tests/test_sglang_torchvision_rebuild.py -q --tb=short

      - name: tests/test_sglang_launch_cell_guards.py
        # sglang-kernel's wheels carry no kernel below compute capability
        # 8.0, so a T4 session has to be turned away in the cell rather
        # than inside the server subprocess.
        run: |
          python -m pytest tests/test_sglang_launch_cell_guards.py -q --tb=short

      - name: tests/test_notebook_image_urls_load.py
        # Downloads every sample image the notebooks fetch, so a link that
        # rots upstream fails here rather than in a user's PIL traceback.
        run: |
          python -m pytest tests/test_notebook_image_urls_load.py -q --tb=short

      - name: tests/test_no_torch_import_before_torch_pin.py
        run: |
          python -m pytest tests/test_no_torch_import_before_torch_pin.py -q --tb=short

      - name: tests/test_fast_inference_installs_vllm.py
        run: |
          python -m pytest tests/test_fast_inference_installs_vllm.py -q --tb=short

      - name: tests/test_upgrade_installs_pin_pillow.py
        run: |
          python -m pytest tests/test_upgrade_installs_pin_pillow.py -q --tb=short

      - name: tests/test_notebook_vllm_pin.py
        run: |
          python -m pytest tests/test_notebook_vllm_pin.py -q --tb=short

      - name: tests/test_python_scripts_regen_parity.py
        # Runs the generator's convert_notebook_to_script (nbconvert
        # PythonExporter) live on each nb/*.ipynb, asserts byte-equal
        # to the committed python_scripts/<name>.py mirror, and
        # ast.parses every mirror as a complete module. Catches the
        # "edited .ipynb without regenerating .py" failure mode the
        # per-cell static parse cannot see. ~2 min sequential.
        run: |
          python -m pytest tests/test_python_scripts_regen_parity.py -q --tb=short

      - name: tests/test_molab_manifest.py
        run: |
          python -m pytest tests/test_molab_manifest.py -q --tb=short

      - name: tests/test_molab_generation_parity.py
        run: |
          python -m pytest tests/test_molab_generation_parity.py -q --tb=short

      - name: tests/test_molab_templated_pins.py
        run: |
          python -m pytest tests/test_molab_templated_pins.py -q --tb=short

      - name: tests/test_amd_templated_kernel_pins.py
        run: |
          python -m pytest tests/test_amd_templated_kernel_pins.py -q --tb=short

      - name: tests/test_molab_marimo_validity.py
        run: |
          python -m pytest tests/test_molab_marimo_validity.py -q --tb=short

      - name: tests/test_molab_dependency_parity.py
        run: |
          python -m pytest tests/test_molab_dependency_parity.py -q --tb=short

      - name: tests/test_molab_readme_links.py
        run: |
          python -m pytest tests/test_molab_readme_links.py -q --tb=short

      - name: tests/test_molab_no_colab_markers.py
        run: |
          python -m pytest tests/test_molab_no_colab_markers.py -q --tb=short

      - name: tests/test_no_backgrounded_shell_command.py
        run: |
          python -m pytest tests/test_no_backgrounded_shell_command.py -q --tb=short

  api-drift:
    # The flagship matrix: assert every classmethod / kwarg the
    # notebooks invoke on unsloth / unsloth_zoo / trl / transformers /
    # peft / datasets still exists, against three (HF, TRL) combos.
    # See tests/test_notebook_api_drift.py for the per-symbol detail.
    strategy:
      fail-fast: false
      matrix:
        combo:
          - id: t4576-trl0latest
            label: "HF=4.57.6 + TRL<1"
            transformers_spec: "transformers==4.57.6"
            trl_spec: "trl>=0.18.2,<1.0.0"
            continue_on_error: false
          - id: pyproject
            label: "HF=default + TRL=default"
            transformers_spec: "__from_pin_constants__"
            trl_spec: "__from_pin_constants__"
            continue_on_error: false
          - id: tlatest5-trl1latest
            label: "HF=latest + TRL=latest"
            transformers_spec: "transformers>=5,<6"
            trl_spec: "trl>=1,<2"
            continue_on_error: true
    name: "api drift (${{ matrix.combo.label }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.combo.continue_on_error }}
    env:
      MATRIX_TRANSFORMERS_SPEC: ${{ matrix.combo.transformers_spec }}
      MATRIX_TRL_SPEC: ${{ matrix.combo.trl_spec }}
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Resolve matrix specs (handle __from_pin_constants__ sentinel)
        # The pyproject cell uses a sentinel; resolve the canonical pin
        # from update_all_notebooks.py:107-117 via the shared inventory
        # helper. Keeps the matrix and the test gate using ONE source of
        # truth for the canonical pin set.
        run: |
          set -euxo pipefail
          python <<'PY' >> "$GITHUB_ENV"
          import os, sys
          sys.path.insert(0, "scripts")
          import notebook_inventory as ni
          pins = ni.read_pin_constants()
          spec_t = os.environ["MATRIX_TRANSFORMERS_SPEC"]
          spec_r = os.environ["MATRIX_TRL_SPEC"]
          if spec_t == "__from_pin_constants__":
              spec_t = f"transformers=={pins.get('transformers', '4.56.2')}"
          if spec_r == "__from_pin_constants__":
              spec_r = f"trl=={pins.get('trl', '0.22.2')}"
          print(f"RESOLVED_TRANSFORMERS_SPEC={spec_t}")
          print(f"RESOLVED_TRL_SPEC={spec_r}")
          PY
          grep RESOLVED_ "$GITHUB_ENV" || true

      - name: Install CPU torch + unsloth + unsloth_zoo from main
        # Same shape used by unslothai/unsloth-zoo's Core matrix:
        # CPU-only torch from the official index, transformers + trl
        # from the matrix cell, then unsloth + unsloth_zoo at
        # git+main --no-deps so we get the just-merged import_fixes.
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install pytest pyyaml \
            protobuf sentencepiece triton \
            'peft>=0.18,<0.20' 'accelerate>=0.34,<2' \
            'numpy<3' 'datasets>=3,<5' \
            nbformat nbconvert ipython pyspellchecker tqdm huggingface_hub
          pip install --index-url https://download.pytorch.org/whl/cpu \
            'torch>=2.4,<2.11' 'torchvision<0.26'
          pip install "$RESOLVED_TRANSFORMERS_SPEC"
          pip install "$RESOLVED_TRL_SPEC"
          pip install 'bitsandbytes>=0.45'
          pip install --no-deps \
            "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo.git@main" \
            "unsloth @ git+https://github.com/unslothai/unsloth.git@main"
          echo "::group::Installed versions"
          pip show transformers trl torch peft datasets unsloth unsloth-zoo 2>/dev/null | grep -E '^(Name|Version):'
          echo "::endgroup::"

      - name: tests/test_notebook_api_drift.py
        run: |
          python -m pytest tests/test_notebook_api_drift.py -v --tb=short

  security-tests:
    name: tests/security (HARD GATE)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install pytest pyyaml

      - run: python -m pytest tests/security -v --tb=short
